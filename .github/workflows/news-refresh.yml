name: Refresh AHP News

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news JSON
        run: python scripts/fetch_news_json.py

      - name: Commit news snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(news): refresh offline AHP news cache"
          file_pattern: data/processed/ahp_news.json

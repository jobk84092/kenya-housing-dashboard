# Nginx reverse proxy for Kenya Housing Dashboard (Contabo).
# Install: sudo cp deploy/nginx-kenya-housing.conf /etc/nginx/sites-available/kenya-housing
#          sudo ln -sf /etc/nginx/sites-available/kenya-housing /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace housing.example.com with your domain, then:
#   sudo certbot --nginx -d housing.example.com

server {
    listen 80;
    server_name housing.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
